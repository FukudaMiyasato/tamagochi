<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tamagochi · audios</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --ink: #1d1c1a; --muted: #77736b; --line: #e6e2d9;
    --accent: #2f6f5e; --warn: #a15c00; --bad: #a3302a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161614; --card: #1f1f1c; --ink: #ecebe6; --muted: #98948a; --line: #2e2d29;
            --accent: #7fc4ae; --warn: #e0a34d; --bad: #ee8279; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .api { margin: 20px 0 28px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .api-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .api small { color: var(--muted); }
  code, pre { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre { margin: 10px 0 0; padding: 10px 12px; background: var(--bg); border-radius: 6px; overflow-x: auto; }
  button, .btn { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink);
                 padding: 6px 12px; border-radius: 7px; }
  button:hover, .btn:hover { border-color: var(--accent); }
  button:focus-visible, .btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  #list { display: grid; gap: 12px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  .meta time { color: var(--ink); font-variant-numeric: tabular-nums; }
  audio { width: 100%; height: 36px; margin: 10px 0; }
  .text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pending { color: var(--warn); }
  .error { color: var(--bad); }
  .error button { margin-left: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Audios recibidos</h1>
    <span class="count" id="count"></span>
  </header>

  <section class="api">
    <div class="api-row">
      <div><strong>API abierta</strong> · <code>POST /api/audios</code><br>
        <small>Campo <code>audio</code> en multipart/form-data, máximo 25 MB.</small></div>
      <label class="btn">Subir audio de prueba
        <input id="file" type="file" accept="audio/*,video/webm,video/mp4" hidden>
      </label>
    </div>
    <pre id="curl"></pre>
  </section>

  <div id="list"></div>
  <p class="empty" id="empty" hidden>Todavía no llegó ningún audio.</p>
</main>

<script>
const list = document.getElementById('list');
const empty = document.getElementById('empty');
const count = document.getElementById('count');
const items = new Map(); // id -> { el, sig }

document.getElementById('curl').textContent =
  `curl -X POST ${location.origin}/api/audios -F "audio=@nota.m4a"`;

const fmtDate = new Intl.DateTimeFormat('es', { dateStyle: 'medium', timeStyle: 'medium' });
const fmtSize = (b) => b < 1048576 ? `${Math.max(1, Math.round(b / 1024))} KB` : `${(b / 1048576).toFixed(1)} MB`;

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function renderBody(a) {
  if (a.status === 'done') {
    return el('p', { className: 'text' }, a.text || '(sin voz detectada)');
  }
  if (a.status === 'transcribing') {
    return el('p', { className: 'text pending' }, 'Transcribiendo…');
  }
  const retry = el('button', { textContent: 'Reintentar' });
  retry.onclick = async () => {
    retry.disabled = true;
    fetch(`/api/audios/${a.id}/transcribe`, { method: 'POST' }).finally(refresh);
    setTimeout(refresh, 300);
  };
  return el('p', { className: 'text error' }, `No se pudo transcribir: ${a.error || 'error desconocido'}`, retry);
}

function createItem(a) {
  const audio = el('audio', { controls: true, preload: 'none', src: a.audio_url });
  const body = el('div');
  const node = el('article', { className: 'item' },
    el('div', { className: 'meta' },
      el('time', { dateTime: a.created_at }, fmtDate.format(new Date(a.created_at))),
      el('span', {}, `#${a.id} · ${a.original_name || a.mime} · ${fmtSize(a.size)}`)),
    audio, body);
  return { el: node, body, sig: '' };
}

async function refresh() {
  let data;
  try { data = await (await fetch('/api/audios')).json(); } catch { return; }
  count.textContent = data.length === 1 ? '1 audio' : `${data.length} audios`;
  empty.hidden = data.length > 0;

  const seen = new Set();
  let prev = null;
  for (const a of data) { // más nuevos primero
    seen.add(a.id);
    let it = items.get(a.id);
    if (!it) { it = createItem(a); items.set(a.id, it); }
    const sig = `${a.status}|${a.text}|${a.error}`;
    if (it.sig !== sig) { it.body.replaceChildren(renderBody(a)); it.sig = sig; }
    // Solo mover si hace falta, para no cortar un audio que esté sonando.
    const expected = prev ? prev.nextSibling : list.firstChild;
    if (expected !== it.el) list.insertBefore(it.el, expected);
    prev = it.el;
  }
  for (const [id, it] of items) if (!seen.has(id)) { it.el.remove(); items.delete(id); }
}

document.getElementById('file').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('audio', file);
  e.target.value = '';
  const req = fetch('/api/audios', { method: 'POST', body: form });
  setTimeout(refresh, 300);
  const res = await req;
  if (!res.ok) alert((await res.json().catch(() => ({}))).error || 'No se pudo subir');
  refresh();
};

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
